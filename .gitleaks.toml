# gitleaks configuration: extends the default rules and allowlists the
# synthetic eval fixtures.
#
# The eval set (data/eval/cases.jsonl, generated by scripts/build_eval_set.py)
# deliberately plants bugs for the reviewer to catch. Case `syn-018`
# ("Hard-coded API token", CWE-798) contains the fake token
# `sk-live-9f8e7d6c5b4a3f2e1d`, which is not a credential of any service: it
# exists so the security scanner has a true positive to detect. gitleaks
# flags it as `generic-api-key`, so both files are allowlisted here.

title = "code-review-agent"

[extend]
useDefault = true

[allowlist]
description = "Synthetic planted secrets in the eval fixtures (not real credentials)"
paths = [
    '''data/eval/cases\.jsonl''',
    '''scripts/build_eval_set\.py''',
]
regexes = ['''sk-live-9f8e7d6c5b4a3f2e1d''']
