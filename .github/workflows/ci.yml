name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy --strict)
        run: mypy --strict src/

      - name: Tests with coverage (>= 70%)
        env:
          ANTHROPIC_API_KEY: ""
          LOG_LEVEL: WARNING
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Offline evaluation reproduces (linter-only, not committed)
        env:
          ANTHROPIC_API_KEY: ""
        run: python -m eval.run --mode linter-only --name ci-check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
